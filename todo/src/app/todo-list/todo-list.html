@if (todos.length === 0) {
<p>No items found.</p>
} @else {
<ul class="todo-group">
  @for (todo of todos; track todo) {
  <li class="todo-item">
    <div class="form-check">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" [checked]="todo.completed" (click)="toggleItem(todo)" />
        {{ todo.title }}
      </label>
    </div>
  </li>
  }
</ul>
}
