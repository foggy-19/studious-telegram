<li class="todo-item">
  <div class="todo-item-content">
    <label class="form-check-label" [ngClass]="cssClasses">
      <input class="form-check-input" type="checkbox" [checked]="item.completed" (click)="toggle()" />
      <span class="form-check-text">{{ item.title }}</span>
    </label>

    <button type="button" class="todo-item-remove" aria-label="Remove todo item" (click)="remove()"></button>
  </div>
</li>
