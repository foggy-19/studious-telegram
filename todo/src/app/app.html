<div class="container">
  <h2>{{ title }}</h2>

  @if (items.length === 0) {
  <p>No items found.</p>
  } @else {
  <ul class="todo-group">
    @for (item of items; track $index) {
    <li class="todo-item">
      <div class="form-check">
        <label class="form-check-label">
          <input class="form-check-input" type="checkbox" [checked]="item.completed" />
          {{ item.title }}
        </label>
      </div>
    </li>
    }
  </ul>
  }
</div>
