<div class="container">
  <h2>{{ title }}</h2>

  <app-add-todo (addTodoEvent)="addTodo($event)"></app-add-todo>

  <select class="form-select" [(ngModel)]="listFilter">
    <option [value]="0">All</option>
    <option [value]="1">Unfulffiled</option>
    <option [value]="2">Fulffiled</option>
  </select>

  <app-todo-list [todos]="visibleItems"></app-todo-list>
</div>
