<div class="container">
  <h2>{{ title }}</h2>

  <form class="form-group">
    <div>
      <input
        type="text"
        class="form-control"
        name="new-item-text"
        [(ngModel)]="newItemText"
        placeholder="Enter todo item"
      />
    </div>
    <div>
      <button type="submit" class="btn btn-primary" (click)="$event.preventDefault(); addItem()">Add Todo</button>
    </div>
  </form>

  <select class="form-select" [(ngModel)]="listFilter">
    <option [value]="0">All</option>
    <option [value]="1">Unfulffiled</option>
    <option [value]="2">Fulffiled</option>
  </select>

  <app-todo-list [todos]="visibleItems"></app-todo-list>
</div>
