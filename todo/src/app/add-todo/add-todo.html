  <form class="form-group">
    <div>
      <input
        type="text"
        class="form-control"
        name="new-item-text"
        [(ngModel)]="newItemText"
        placeholder="Enter todo item"
      />
    </div>
    <div>
      <button type="submit" class="btn btn-primary" (click)="$event.preventDefault(); addItem()">Add Todo</button>
    </div>
  </form>
