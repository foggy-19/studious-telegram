  <form class="form-group">
    <div>
      <input
        type="text"
        class="form-control"
        name="new-todo-text"
        [(ngModel)]="title"
        placeholder="Enter todo item"
      />
    </div>
    <div>
      <button type="submit" class="btn btn-primary" (click)="$event.preventDefault(); addTodoItem()">Add Todo</button>
    </div>
  </form>
