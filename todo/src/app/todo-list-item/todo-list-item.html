<li class="todo-item">
  <div class="todo-item-content">
    <label class="form-check-label" [ngClass]="cssClasses">
      <input class="form-check-input" type="checkbox" [checked]="item.completed" (click)="toggle()" />
      {{ item.title }}
    </label>

    <button type="button" class="btn-close" (click)="remove()"></button>
  </div>
</li>
